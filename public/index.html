<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediSched | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tw-config.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-white">
  <div class="w-full max-w-4xl grid md:grid-cols-2 rounded-[2.5rem] overflow-hidden border-4 border-gray-200 min-h-[34rem]">

    <!-- Left: brand + doctors -->
    <div class="relative bg-white hidden md:flex flex-col items-center pt-12 overflow-hidden">
      <div id="brand"></div>
      <svg viewBox="0 0 340 230" class="absolute bottom-0 left-0 w-full" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#cfd8e3">
          <circle cx="70" cy="70" r="24" fill="#e8b894" stroke="none"/><path d="M15 230V140q0-30 55-35t55 35v90z" fill="#fff"/>
          <circle cx="270" cy="75" r="24" fill="#d9a67e" stroke="none"/><path d="M215 230V145q0-30 55-35t55 35v90z" fill="#fff"/>
          <circle cx="170" cy="50" r="28" fill="#f0c4a0" stroke="none"/><path d="M100 230V125q0-35 70-40t70 40v105z" fill="#fff"/>
          <path d="M150 90v55a20 20 0 0040 0V90" fill="none" stroke="#3a3a3a" stroke-width="3"/>
        </g>
      </svg>
      <!-- put your own photo at public/img/doctors.png -->
      <img src="/img/doctors.png" alt="" onerror="this.remove()" class="absolute bottom-0 left-0 w-full h-[62%] object-cover object-top">
    </div>

    <!-- Right: form -->
    <div class="bg-parchment px-8 md:px-12 py-12 flex flex-col justify-center">
      <div class="md:hidden mb-6 flex justify-center" id="brand-sm"></div>
      <h1 class="text-3xl font-bold text-brown">Login to your account</h1>
      <p class="text-sm text-brown mt-1">Login to gain access...</p>

      <form id="login-form" class="mt-8 space-y-5" novalidate>
        <div>
          <label class="font-bold text-sm ml-1">Username</label>
          <div class="relative mt-1.5">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></span>
            <input id="username" class="input-field has-icon" placeholder="Enter your username" autocomplete="username">
          </div>
        </div>
        <div>
          <label class="font-bold text-sm ml-1">Password</label>
          <div class="relative mt-1.5">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></span>
            <input id="password" type="password" class="input-field has-icon" placeholder="Enter your password" autocomplete="current-password">
          </div>
        </div>
        <p id="error" class="text-red-600 text-sm min-h-[1.25rem]"></p>
        <div class="flex justify-center">
          <button id="login-btn" class="btn-primary !px-10">Login</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
